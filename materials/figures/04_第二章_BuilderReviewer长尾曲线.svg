<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
  <title id="title">Builder 与 Reviewer 的长尾收敛曲线</title>
  <desc id="desc">前期 Builder Token 消耗高，后期 Reviewer 对系统收敛的相对作用上升，修复进入 P2/P3 长尾。</desc>
  <rect width="1040" height="540" fill="#fbfaf7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="44" y="45" font-size="25" font-weight="650" fill="#1f2933">Builder—Reviewer Loop：先大幅推进，再拖着长尾收敛</text>
    <text x="44" y="74" font-size="15" fill="#68737d">这是群聊中的相对趋势，不是统一条件下的 Token Benchmark</text>
    <line x1="95" y1="440" x2="970" y2="440" stroke="#7b8792" stroke-width="1.5"/>
    <line x1="95" y1="440" x2="95" y2="115" stroke="#7b8792" stroke-width="1.5"/>
    <text x="28" y="160" font-size="14" fill="#52606d" transform="rotate(-90 28 160)">相对投入 / 作用</text>
    <text x="830" y="478" font-size="14" fill="#52606d">任务进展</text>
    <line x1="95" y1="320" x2="970" y2="320" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 6"/>
    <path d="M 115 145 C 220 155, 270 230, 355 300 C 465 365, 625 390, 945 410" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <path d="M 115 405 C 280 397, 400 370, 520 320 C 650 265, 760 205, 945 145" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
    <circle cx="115" cy="145" r="7" fill="#f97316"/><circle cx="945" cy="410" r="7" fill="#f97316"/>
    <circle cx="115" cy="405" r="7" fill="#a855f7"/><circle cx="945" cy="145" r="7" fill="#a855f7"/>
    <text x="130" y="135" font-size="15" fill="#c2410c">Builder Token：高</text>
    <text x="785" y="430" font-size="15" fill="#c2410c">Builder：低</text>
    <text x="130" y="430" font-size="15" fill="#7c3aed">Reviewer：低</text>
    <text x="785" y="135" font-size="15" fill="#7c3aed">Reviewer：高</text>
    <text x="180" y="205" font-size="13" fill="#52606d">功能铺开</text>
    <text x="450" y="365" font-size="13" fill="#52606d">P0 / P1 清理</text>
    <text x="730" y="250" font-size="13" fill="#52606d">P2 / P3 长尾</text>
    <rect x="110" y="98" width="180" height="30" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="200" y="118" text-anchor="middle" font-size="12" fill="#9a3412">前约 20% 时间</text>
    <rect x="780" y="98" width="180" height="30" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="870" y="118" text-anchor="middle" font-size="12" fill="#7c3aed">后约 80% 时间</text>
  </g>
</svg>
