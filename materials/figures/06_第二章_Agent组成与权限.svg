<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent 的四个组成部分</title>
  <desc id="desc">Agent 的行为由 Model、Tool、Action 和 Permission 共同决定，最终作用于具体产物和环境。</desc>
  <rect width="900" height="520" fill="#fbfaf7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="42" y="46" font-size="25" font-weight="650" fill="#1f2933">Agent = Model × Tool × Action × Permission</text>
    <text x="42" y="75" font-size="15" fill="#68737d">同一个模型，换一组工具、动作或权限边界，也会变成不同的 Agent</text>
    <line x1="450" y1="245" x2="450" y2="155" stroke="#94a3b8" stroke-width="2"/>
    <line x1="450" y1="245" x2="450" y2="335" stroke="#94a3b8" stroke-width="2"/>
    <line x1="450" y1="245" x2="280" y2="245" stroke="#94a3b8" stroke-width="2"/>
    <line x1="450" y1="245" x2="620" y2="245" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="450" cy="245" r="72" fill="#1f2933" stroke="#0f172a" stroke-width="3"/>
    <text x="450" y="239" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Agent</text>
    <text x="450" y="263" text-anchor="middle" font-size="12" fill="#cbd5e1">行动单元</text>
    <rect x="355" y="100" width="190" height="55" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="450" y="133" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">Model</text>
    <rect x="355" y="335" width="190" height="55" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="450" y="368" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">Tool</text>
    <rect x="115" y="217" width="190" height="55" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="210" y="250" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">Action</text>
    <rect x="595" y="217" width="190" height="55" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="690" y="250" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">Permission</text>
    <rect x="285" y="445" width="330" height="42" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="450" y="472" text-anchor="middle" font-size="14" fill="#166534">产物、环境、验证器与人类责任</text>
  </g>
</svg>
