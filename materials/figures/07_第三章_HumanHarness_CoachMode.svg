<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="500" viewBox="0 0 1060 500" role="img" aria-labelledby="title desc">
  <title id="title">Human Harness 与 Coach Mode</title>
  <desc id="desc">Agent 分层生成计划，每个关键阶段通过理解检查和人类放行，避免人只在计划完成后才发现设计已经偏离。</desc>
  <rect width="1060" height="500" fill="#fbfaf7"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7b8792"/></marker></defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="42" y="46" font-size="25" font-weight="650" fill="#1f2933">Human Harness：把人带进关键决策点</text>
    <text x="42" y="75" font-size="15" fill="#68737d">Coach Mode 不要求人阅读全部 Trace，而是在 Plan 展开时检查记忆、理解和放行</text>
    <line x1="185" y1="225" x2="260" y2="225" stroke="#7b8792" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="425" y1="225" x2="500" y2="225" stroke="#7b8792" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="665" y1="225" x2="740" y2="225" stroke="#7b8792" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="40" y="185" width="145" height="80" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="112" y="218" text-anchor="middle" font-size="13" fill="#2563eb">Agent</text><text x="112" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">First-pass Plan</text>
    <rect x="260" y="185" width="165" height="80" rx="11" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="342" y="218" text-anchor="middle" font-size="13" fill="#c2410c">Comprehension</text><text x="342" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">记忆 / 自检 / 教育</text>
    <rect x="500" y="185" width="165" height="80" rx="11" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="582" y="218" text-anchor="middle" font-size="13" fill="#7c3aed">Human Gate</text><text x="582" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">理解后放行</text>
    <rect x="740" y="185" width="175" height="80" rx="11" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="827" y="218" text-anchor="middle" font-size="13" fill="#15803d">Next Layer</text><text x="827" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">继续展开 Plan</text>
    <path d="M 582 265 C 582 350, 340 350, 340 265" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
    <text x="455" y="365" text-anchor="middle" font-size="13" fill="#7c3aed">回答偏差：回到设计意图、AI 方案或背景知识缺口</text>
    <rect x="40" y="415" width="875" height="42" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="477" y="442" text-anchor="middle" font-size="14" fill="#475569">Human Harness 的目标：让人保持对产物的认知同步，而不是增加一个最后才出现的确认框。</text>
  </g>
</svg>
